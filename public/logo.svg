<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60">
    <defs>
        <style>
            .icon {
                fill: none;
                stroke: #F37EA1;
                stroke-width: 8;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .wordmark {
                font: 600 46px 'Kanit-SemiBold', 'Kanit', system-ui, -apple-system, sans-serif;
                fill: #626D73;
                letter-spacing: -0.01em;
            }
        </style>
    </defs>
    <!-- Wordmark on the left. -->
    <text class="wordmark" x="8" y="45">LOGER</text>
    <!-- House mark on the right (floor → right wall → roof, single connected path).
         vector-effect keeps the 8px stroke crisp at any render size. -->
    <path
        class="icon"
        d="M192 50 L232 50 L232 22 L209 5"
        vector-effect="non-scaling-stroke"
    />
</svg>
