services:
  loger:
    build:
      args:
        uid: 1000
        TZ: America\New_York
      context: ./
      dockerfile: coolify.Dockerfile
    image: freesgen/loger
    container_name: loger-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./docker-compose/web/timezone:/etc/timezone
      - ./storage:/var/www/storage
      - /var/.config/gcloud/loger/credentials.json:/var/www/credentials.json
    env_file:
      - .env
    environment:
      AUTORUN_ENABLED: true
      # Migration isolation is OFF on purpose. The isolation lock is taken
      # through the cache store, and with CACHE_DRIVER=database that means
      # `cache_locks` — a table that only exists *after* migrations run.
      # On a fresh database the first deploy therefore dies with
      # "Table 'cache_locks' doesn't exist" before migrating anything.
      # It also protects nothing here: `loger` is the only service with
      # AUTORUN_ENABLED, so no second container races it.
      AUTORUN_LARAVEL_MIGRATION_ISOLATION: false
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
  task:
    build:
      context: ./
      dockerfile: coolify.Dockerfile
    image: freesgen/loger
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      PHP_PFM_POOL_NAME: "loger_task"
    volumes:
      - /var/.config/gcloud/loger/credentials.json:/var/www/credentials.json
    depends_on:
      loger:
        condition: service_healthy
  # Real-time hub for the shared shopping list. Laravel publishes to
  # http://mercure/.well-known/mercure (MERCURE_URL); browsers subscribe through
  # the public domain Coolify assigns to this service (MERCURE_PUBLIC_URL).
  # Topics are public share-token URLs, so subscribers are anonymous; only the
  # app can publish, signing with MERCURE_SECRET (HS256, at least 32 chars).
  mercure:
    image: dunglas/mercure:v0.18
    restart: unless-stopped
    mem_limit: 128m
    expose:
      - "80"
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |-
        anonymous
        cors_origins ${APP_URL}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  queue:
    build:
      context: ./
      dockerfile: coolify.Dockerfile
    image: freesgen/loger
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3"]
    environment:
      PHP_FPM_POOL_NAME: "loger_queue"
    depends_on:
      loger:
        condition: service_healthy
